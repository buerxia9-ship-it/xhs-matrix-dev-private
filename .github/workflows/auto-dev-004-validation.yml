# Isolated AUTO-DEV-004 verification. Runs only on this development branch.
# No production secrets, credentials, external business APIs, posting, deployment or main writes.
name: AUTO-DEV-004 Offline Validation
on:
  push:
    branches:
      - dev/auto-dev-004-content-pipeline
    paths:
      - .github/workflows/auto-dev-004-validation.yml
      - backend-ts/**
      - frontend/**
      - runtime-patches/**
      - tests/**
      - cloud/**
      - package.json

permissions:
  contents: read

concurrency:
  group: auto-dev-004-validation
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify runtime
        run: node --version && npm --version
      - name: Full repository offline tests
        run: npm test

  frontend-build:
    name: Locked frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build Vue frontend
        run: npm --prefix frontend run build

  backend-build:
    name: Locked Prisma and NestJS build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./ci-synthetic.db
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install locked backend dependencies
        run: npm ci --prefix backend-ts --no-audit --no-fund
      - name: Generate Prisma client (no DB connection)
        run: npm --prefix backend-ts run prisma:generate
      - name: Backend TypeScript typecheck
        run: npm --prefix backend-ts run tsc
      - name: Build NestJS backend
        run: npm --prefix backend-ts run build
